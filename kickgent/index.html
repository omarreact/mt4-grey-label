  <style>
    /* 01 — DESIGN TOKENS / RESET ------------------------------------------- */
    :root {
      color-scheme: dark;
      --background: #090613;
      --background-2: #10091e;
      --surface: #171126;
      --surface-raised: #201731;

      --container: 1200px;

    .browser { position: relative; overflow: hidden; border: 1px solid rgba(202,168,255,.32); border-radius: 16px 16px 0 0; background: #100d1d; box-shadow: 0 33px 100px rgba(0,0,0,.55), 0 0 85px rgba(131,62,226,.12); }
